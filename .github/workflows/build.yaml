name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  BUILD_TYPE: Release

jobs:
  linux:
    runs-on: ubuntu-20.04

    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.5.2"
          host: "linux"
          target: "desktop"
          arch: "gcc_64"
          install-deps: "true"
          cache: "true"

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Resolve version metadata
        id: version
        run: echo "hash=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-qt6.5.2
          max-size: 500M

      - name: Install mold
        uses: rui314/setup-mold@v1
        with:
          mold-version: "2.2.0"
          make-default: false

      - name: Configure CMake
        run: |
          cmake -B '${{github.workspace}}'/build \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold

      - name: Build
        run: |
          BUILD_START=$(date +%s)
          cmake --build '${{github.workspace}}'/build
          echo "BUILD_SECONDS=$(( $(date +%s) - BUILD_START ))" >> "$GITHUB_ENV"

      - name: Download linuxdeployqt
        run: |
          wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage

      - name: Download dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libxcb-cursor0

      - name: Package artifacts with linuxdeployqt
        run: |
          mkdir -p appdir/usr/bin/
          mv ./build/Orianne appdir/usr/bin/
          export VERSION=0.0.1-${{ steps.version.outputs.hash }}-linux # linuxdeployqt uses this for naming the package
          echo "Version is: ${VERSION}"
          ./linuxdeployqt-continuous-x86_64.AppImage --appimage-extract-and-run appdir/usr/share/applications/*.desktop \
            -appimage -verbose=2 -extra-plugins=iconengines

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Linux build"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ steps.version.outputs.hash }}\` |"
            echo "| Build time | ${BUILD_SECONDS}s |"
            echo "| Linker | mold 2.2.0 |"
            echo "| \`ccache\` hit rate | $(ccache -s | grep -m1 'Hits:' | awk '{print $NF}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: Orianne-linux-appimage
          path: Orianne*.AppImage

  windows:
    runs-on: windows-latest

    steps:
      - name: Setup Microsoft Visual C++
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.5.2"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          install-deps: "true"
          cache: "true"

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Resolve version metadata
        id: version
        shell: bash
        run: echo "hash=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: windows-qt6.5.2
          max-size: 500M
          variant: sccache

      - name: Build for Windows
        shell: bash
        run: |
          BUILD_START=$(date +%s)
          cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -B '${{github.workspace}}'/build
          cmake --build '${{github.workspace}}'/build
          echo "BUILD_SECONDS=$(( $(date +%s) - BUILD_START ))" >> "$GITHUB_ENV"

      - name: Package Executables with windeployqt
        shell: bash
        run: |
          VERSION=0.0.1-${{ steps.version.outputs.hash }}-win
          APPNAME=Orianne-${VERSION}.zip
          echo "APPNAME=${APPNAME}" >> $GITHUB_ENV

          mkdir packageDir
          pushd packageDir
          mv '${{github.workspace}}'/build/Orianne.exe .

          windeployqt.exe -svg --release --no-compiler-runtime --no-opengl-sw --no-translations Orianne.exe
          7z a -r ../${APPNAME} *
          popd

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Windows build"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ steps.version.outputs.hash }}\` |"
            echo "| Build time | ${BUILD_SECONDS}s |"
            echo "| Compiler cache | sccache |"
            echo "| Archive | ${APPNAME} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v3
        with:
          name: Orianne-windows
          path: ${{ env.APPNAME }}

  macos:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.5.2"
          host: "mac"
          target: "desktop"
          install-deps: "true"
          cache: "true"

      - name: Resolve version metadata
        id: version
        run: echo "hash=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-qt6.5.2
          max-size: 500M

      - name: Configure CMake (universal binary)
        run: |
          cmake -B '${{github.workspace}}'/build \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: |
          BUILD_START=$(date +%s)
          cmake --build '${{github.workspace}}'/build
          echo "BUILD_SECONDS=$(( $(date +%s) - BUILD_START ))" >> "$GITHUB_ENV"

      - name: Verify universal binary
        run: |
          BIN='${{github.workspace}}'/build/Orianne.app/Contents/MacOS/Orianne
          lipo -info "$BIN"
          lipo -archs "$BIN" | grep -q x86_64
          lipo -archs "$BIN" | grep -q arm64

      - name: Package
        run: |
          VERSION=0.0.1-${{ steps.version.outputs.hash }}-macos
          APPNAME=Orianne-${VERSION}.zip
          echo "APPNAME=${APPNAME}" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent '${{github.workspace}}'/build/Orianne.app "${APPNAME}"

      - name: Build summary
        if: always()
        run: |
          {
            echo "### macOS build"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ steps.version.outputs.hash }}\` |"
            echo "| Build time | ${BUILD_SECONDS}s |"
            echo "| Architectures | arm64, x86_64 (universal) |"
            echo "| Archive | ${APPNAME} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v3
        with:
          name: Orianne-macos
          path: ${{ env.APPNAME }}

  windows-smoke-test:
    needs: windows
    runs-on: ubuntu-20.04

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v3
        with:
          name: Orianne-windows
          path: winbuild

      - name: Install Wine & screenshot tooling
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32 xvfb imagemagick

      - name: Unpack build
        run: |
          cd winbuild
          unzip -o *.zip -d unpacked

      - name: Launch under Wine and screenshot
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" bash -c '
            set -e
            export WINEDLLOVERRIDES="mscoree,mshtml="
            export WINEDEBUG=-all
            wine winbuild/unpacked/Orianne.exe &
            WINE_PID=$!
            sleep 20
            import -window root wine-screenshot.png
            kill $WINE_PID || true
          '

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: wine-smoke-test-screenshot
          path: wine-screenshot.png
